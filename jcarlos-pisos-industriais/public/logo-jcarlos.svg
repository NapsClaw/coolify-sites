<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 72" fill="none">
  <!-- Badge azul com monograma JC -->
  <rect x="1" y="3" width="66" height="66" rx="8" fill="#0361a8"/>
  <rect x="1" y="3" width="66" height="66" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Texto JC centralizado no badge -->
  <text x="34" y="46"
        font-family="Georgia,'Times New Roman',serif"
        font-size="30" font-weight="700"
        fill="white" text-anchor="middle">JC</text>
  <!-- Linha sutil abaixo do JC -->
  <rect x="12" y="51" width="44" height="1.5" rx="1" fill="rgba(255,255,255,0.3)"/>
  <!-- Texto inferior no badge -->
  <text x="34" y="63"
        font-family="Arial,Helvetica,sans-serif"
        font-size="8" font-weight="500"
        fill="rgba(255,255,255,0.75)" text-anchor="middle"
        letter-spacing="0.5">DESDE 2004</text>

  <!-- Nome: JCARLOS -->
  <text x="84" y="32"
        font-family="Georgia,'Times New Roman',serif"
        font-size="24" font-weight="700"
        fill="white" letter-spacing="1">JCARLOS</text>

  <!-- Linha divisória fina -->
  <rect x="84" y="38" width="218" height="1.2" rx="0.6" fill="#0361a8"/>

  <!-- Subtítulo: PISOS INDUSTRIAIS -->
  <text x="84" y="57"
        font-family="Arial,Helvetica,sans-serif"
        font-size="11.5" font-weight="400"
        fill="#5aabec" letter-spacing="3.5">PISOS INDUSTRIAIS</text>
</svg>
